<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #fff9e6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 40px 20px;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .icon {
            font-size: 80px;
            color: #ffc107;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #333;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #666;
            line-height: 1.5;
        }
        
        .contact {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 16px;
            color: #777;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Sitio en mantenimiento</h1>
        <p>Estamos realizando tareas de mantenimiento para mejorar nuestro servicio. Por favor, vuelve a intentarlo más tarde.</p>
        <p>Disculpa las molestias.</p>
        <div class="contact">
            Si necesitas asistencia urgente.
        </div>
    </div>
</body>
</html>
